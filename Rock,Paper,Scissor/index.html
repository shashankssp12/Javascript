<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <h1>Rock Paper Scissors</h1>
    </nav>

    <div id="wrapper">
        <div class="options" id="rock-btn" ></div>
        <div class="options" id="paper-btn"></div>
        <div class="options" id="scissors-btn"></div>
    </div>
    <div id="scores">
        <div id="userScore">
            <h1>0</h1>
            <h2>You</h2>
        </div>
        <div id="compScore">
            <h1>0</h1>
            <h2>Comp</h2>
        </div>
    </div>
    <!-- msg area -->
    <div id="msgBox">
        <p>
         --Round Update--
        </p>
    </div>

    <script src="app.js"></script>
</body>

</html>
